<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alimente | Cadastrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          },
          colors: {
            alimente: {
              yellow: '#FFD700',
              black: '#1A1A1A',
              background: '#F9FAFB'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-alimente-background font-sans text-alimente-black antialiased">
  <main class="flex min-h-screen items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
    <section class="w-full max-w-[440px] rounded-3xl border border-neutral-200 bg-white px-6 py-8 shadow-lg sm:px-9 sm:py-10" aria-labelledby="signup-title">
      <h1 id="signup-title" class="text-center text-3xl font-bold leading-tight text-black">Cadastrar</h1>

      <form class="mt-8 space-y-5" action="#" method="post" enctype="multipart/form-data" novalidate>
        <fieldset aria-label="Tipo de entidade">
          <div class="grid grid-cols-2 gap-2 rounded-full bg-gray-100 p-1">
            <label class="cursor-pointer">
              <input class="peer sr-only" type="radio" name="tipo_entidade" value="empresa" checked>
              <span class="flex min-h-11 items-center justify-center rounded-full bg-gray-200 px-4 text-sm font-bold text-gray-700 transition hover:bg-gray-300 peer-checked:bg-alimente-yellow peer-checked:text-black peer-checked:shadow-sm peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-black">
                Empresa
              </span>
            </label>
            <label class="cursor-pointer">
              <input class="peer sr-only" type="radio" name="tipo_entidade" value="ong">
              <span class="flex min-h-11 items-center justify-center rounded-full bg-gray-200 px-4 text-sm font-bold text-gray-700 transition hover:bg-gray-300 peer-checked:bg-alimente-yellow peer-checked:text-black peer-checked:shadow-sm peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-black">
                ONG
              </span>
            </label>
          </div>
        </fieldset>

        <div class="space-y-3">
          <label class="sr-only" for="nome">Nome da Entidade</label>
          <input class="h-12 w-full rounded-xl border border-gray-300 bg-white px-4 text-base text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-alimente-yellow focus:ring-4 focus:ring-yellow-100" type="text" id="nome" name="nome" placeholder="Nome" autocomplete="organization" required>

          <label class="sr-only" for="cnpj">CNPJ</label>
          <input class="h-12 w-full rounded-xl border border-gray-300 bg-white px-4 text-base text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-alimente-yellow focus:ring-4 focus:ring-yellow-100" type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" inputmode="numeric" maxlength="18" autocomplete="off" required>

          <label class="sr-only" for="email">Email</label>
          <input class="h-12 w-full rounded-xl border border-gray-300 bg-white px-4 text-base text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-alimente-yellow focus:ring-4 focus:ring-yellow-100" type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>

          <label class="block text-sm font-semibold text-gray-900" for="senha">Senha</label>
          <input class="h-12 w-full rounded-xl border border-gray-300 bg-white px-4 text-base text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-alimente-yellow focus:ring-4 focus:ring-yellow-100" type="password" id="senha" name="senha" placeholder="Senha" autocomplete="new-password" required>
        </div>

        <div class="space-y-3 pt-1">
          <label class="block">
            <span class="mb-2 block text-sm font-semibold text-gray-900">CartÃ£o CNPJ</span>
            <span class="upload-dropzone flex min-h-24 cursor-pointer items-center justify-center rounded-xl border-2 border-dashed border-gray-300 bg-gray-50 px-4 text-center text-sm font-medium text-gray-500 transition hover:border-alimente-yellow hover:bg-yellow-50">
              Clique ou arraste uma imagem
            </span>
            <input class="sr-only" type="file" name="cartao_cnpj" accept="image/*">
          </label>

          <label class="block">
            <span class="mb-2 block text-sm font-semibold text-gray-900">Documento do ResponsÃ¡vel Legal</span>
            <span class="upload-dropzone flex min-h-24 cursor-pointer items-center justify-center rounded-xl border-2 border-dashed border-gray-300 bg-gray-50 px-4 text-center text-sm font-medium text-gray-500 transition hover:border-alimente-yellow hover:bg-yellow-50">
              Clique ou arraste uma imagem
            </span>
            <input class="sr-only" type="file" name="documento_responsavel" accept="image/*">
          </label>

          <label class="block">
            <span class="mb-2 block text-sm font-semibold text-gray-900">Comprovante de EndereÃ§o</span>
            <span class="upload-dropzone flex min-h-24 cursor-pointer items-center justify-center rounded-xl border-2 border-dashed border-gray-300 bg-gray-50 px-4 text-center text-sm font-medium text-gray-500 transition hover:border-alimente-yellow hover:bg-yellow-50">
              Clique ou arraste uma imagem
            </span>
            <input class="sr-only" type="file" name="comprovante_endereco" accept="image/*">
          </label>
        </div>

        <button class="h-12 w-full rounded-xl bg-alimente-yellow px-5 text-base font-bold text-black transition hover:bg-[#E6C200] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black active:scale-[0.99]" type="submit">
          Cadastrar
        </button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var cnpjInput = document.getElementById('cnpj');
      var dropzones = Array.from(document.querySelectorAll('.upload-dropzone'));

      if (cnpjInput) {
        cnpjInput.addEventListener('input', function () {
          var digits = cnpjInput.value.replace(/\D/g, '').slice(0, 14);
          var formatted = digits
            .replace(/^(\d{2})(\d)/, '$1.$2')
            .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
            .replace(/\.(\d{3})(\d)/, '.$1/$2')
            .replace(/(\d{4})(\d)/, '$1-$2');

          cnpjInput.value = formatted;
        });
      }

      dropzones.forEach(function (zone) {
        var input = zone.parentElement.querySelector('input[type="file"]');

        ['dragenter', 'dragover'].forEach(function (eventName) {
          zone.addEventListener(eventName, function (event) {
            event.preventDefault();
            zone.classList.add('border-alimente-yellow', 'bg-yellow-50', 'text-gray-900');
          });
        });

        ['dragleave', 'drop'].forEach(function (eventName) {
          zone.addEventListener(eventName, function (event) {
            event.preventDefault();
            zone.classList.remove('border-alimente-yellow', 'bg-yellow-50', 'text-gray-900');
          });
        });

        zone.addEventListener('drop', function (event) {
          if (input && event.dataTransfer.files.length) {
            input.files = event.dataTransfer.files;
          }
        });
      });
    }());
  </script>
</body>
</html>
